[env]
# Native code built by build scripts targets the same macOS version as the
# bundle (`minimumSystemVersion` in tauri.conf.json); ignored outside Apple
# targets.
MACOSX_DEPLOYMENT_TARGET = "10.15"

# Speech models (Parakeet and Whisper; Spec 0108, ADR 0157) run on ONNX Runtime. `ort-sys` downloads the
# prebuilt static library once at build time (hash-checked, from its build
# script) and links it in; nothing is fetched at run time. Not built for
# Android. A fully offline build needs `ORT_LIB_PATH` pointing at a local copy.

# Android 15+ devices may use 16 KB memory pages: every .so must have its LOAD
# segments aligned to 16 KB. NDK r27 links with 4 KB unless told otherwise
# (docs/android-build.md). Static native parts (OpenSSL, ONNX Runtime) end up
# in the same cdylib, so the one link flag covers them.
[target.aarch64-linux-android]
rustflags = ["-C", "link-arg=-Wl,-z,max-page-size=16384"]

[target.x86_64-linux-android]
rustflags = ["-C", "link-arg=-Wl,-z,max-page-size=16384"]
