# cargo-audit Konfiguration (Spec 0090, A2–A4).
#
# Läuft gegen `Cargo.lock` über den gesamten Workspace. Jede Ausnahme hier
# trägt einen Begründungskommentar direkt daneben — nie eine
# stillschweigend ignorierte Advisory. Entscheidungen unten sind mit dem
# Nutzer abgestimmt (nicht eigenmächtig getroffen), s. Chat-Verlauf zum
# lokalen `cargo audit`-Befund vom 2026-09-04.
#
# HINWEIS zum Schema (installierte cargo-audit-Version 0.22.2, geprüft
# gegen deren `AdvisoryConfig`/`Report::generate`-Quelltext, s.
# ~/.cargo/registry/.../cargo-audit-0.22.2/src/config.rs und
# rustsec-0.33.0/src/report.rs): `[advisories].ignore` akzeptiert
# AUSSCHLIESSLICH eine flache Liste von RUSTSEC-IDs (Strings) — keine
# Tabellen-Einträge mit eingebettetem `reason`-Feld (ein früherer Entwurf
# dieser Datei ging fälschlich davon aus; die Begründungen stehen deshalb
# als Kommentare direkt über der jeweiligen ID, nicht inline in der
# TOML-Struktur). Dieselbe `ignore`-Liste wirkt sowohl auf echte
# Vulnerabilities als auch auf informational Warnings (unmaintained/
# unsound), da beide über dieselbe Advisory-ID gefiltert werden.
#
# Yanked findings have no RUSTSEC id (the yanked check runs against the
# crates.io index, not the advisory database) and cannot be suppressed
# individually in this list; they are resolved by updating the lockfile.
# `[yanked] enabled = false` would disable the check completely and is
# deliberately not used.

[advisories]
# Spec 0090, A3/A4: jede Ausnahme unten nennt das betroffene Crate, die
# Version im Lockfile, gegen die entschieden wurde, und die Bedingung, an
# der man erkennt, dass sie überholt ist ("Entschieden gegen" /
# "Überholt, wenn"). Eine CI-Prüfung (Workflow `Community`, Job
# `dependency-audit`) gleicht diese Liste bei jedem Lauf gegen einen
# `cargo audit`-Aufruf ohne Ausnahmeliste ab: trifft eine hier eingetragene
# ID auf keinen aktuellen Befund mehr, wird der Lauf rot (s. Kommentar beim
# entsprechenden Workflow-Schritt). Die 10 Ausnahmen für die zurückgezogene
# GTK3-Advisory-Reihe RUSTSEC-2024-0411 bis -0420 sind deshalb entfernt,
# nicht nur veraltet kommentiert — ihre Advisories tragen `withdrawn` in der
# RustSec-Datenbank und träfen auf keinen Befund mehr.
ignore = [
    # --- Echte Sicherheitslücke: dokumentiertes Risk-Acceptance ---------
    #
    # RUSTSEC-2023-0071 — "Marvin Attack": potenzielles RSA-Key-Recovery
    # über Timing-Seitenkanäle. Betroffen: `rsa` v0.10.0-rc.18, transitiv
    # über `russh`/`ssh-key` (crates/ssh-transport) — also im aktiven
    # SSH-Auth-Pfad, nicht totem Code.
    #
    # Bedrohungsmodell: Smart SSH ist ein lokaler Client. Der private
    # RSA-Schlüssel liegt lokal, die Signaturoperation läuft auf der
    # Maschine des Nutzers selbst. Der Marvin-Angriff braucht viele
    # präzise Timing-Messungen genau dieser Operation von außen — für
    # einen lokalen Client strukturell deutlich schwerer auszunutzen als
    # für einen von außen exponierten TLS-Server-Endpunkt (das übliche
    # Angriffsszenario dieser Advisory-Klasse).
    #
    # Kein Upstream-Fix verfügbar (Advisory selbst: "No fixed upgrade is
    # available!"). `rsa` wird transitiv über `russh` gezogen — ein
    # Ersetzen der SSH-Kernbibliothek wäre ein deutlich größerer Eingriff
    # und selbst riskanter als das verbleibende Risiko dieser Advisory.
    #
    # Entschieden gegen: `rsa` 0.10.0-rc.18 (Cargo.lock). Überholt, sobald
    # eines zutrifft: ein Fix für `rsa` erscheint (die Advisory selbst
    # nennt aktuell keinen), oder `russh`/`rsa` wird aktualisiert
    # (Re-Evaluierungs-Auftrag unten).
    #
    # Offener Punkt, NICHT nur hier vermerkt: s.
    # docs/adr/0028-rsa-marvin-attack-risk-acceptance.md für das Tracking
    # und den Re-Evaluierungs-Auftrag (bei `russh`/`rsa`-Update erneut
    # prüfen). Eine mögliche Bevorzugung von Ed25519 in der App ist ein
    # separates, bewusst NICHT Teil dieses CI-Schritts entschiedenes Thema.
    "RUSTSEC-2023-0071",

    # --- GTK3-Kette: ausschließlich Tauris Linux-Webview-Backend --------
    #
    # proc-macro-error ist "unmaintained" — transitiv über glib-macros,
    # Teil derselben gtk-rs/GTK3-Kette wie RUSTSEC-2024-0429 unten
    # (verifiziert via `cargo tree --target all`: ausschließlich unter
    # Linux kompiliert, für macOS/Windows-Builds nie in der
    # Abhängigkeitsmenge). Transitiv, Linux-only, kein Fix verfügbar,
    # ökosystemweit bekanntes GTK3→GTK4-Migrationsthema (betrifft jede
    # Tauri-2-App unter Linux gleichermaßen, nicht spezifisch für dieses
    # Projekt) — ohne Verzicht auf Linux-Support nicht behebbar.
    #
    # Entschieden gegen: `proc-macro-error` 1.0.4 (Cargo.lock). Überholt,
    # wenn `cargo audit` diese ID nicht mehr meldet (Crate ersetzt/
    # aktualisiert) oder die GTK3-Kette entfällt.
    "RUSTSEC-2024-0370",

    # --- RUSTSEC-2024-0429: bewusst ANDERS behandelt als "unmaintained" -
    #
    # Unsoundness in `glib::VariantStrIter`s `Iterator`/
    # `DoubleEndedIterator`-Implementierungen. Linux-only via gtk-rs (s.
    # GTK3-Kette oben), tief in gtk-rs-Interna — unser eigener Code ruft
    # `VariantStrIter` nirgends direkt auf. Anders als die reinen
    # "unmaintained"-Einträge oben ist das eine "unsound"-Einstufung, kein
    # bloßes Staleness-Signal — deshalb NICHT als "irrelevant" eingestuft,
    # sondern als aktiv zu beobachten: bei jedem gtk-rs-Versions-Update
    # (glib/gtk/atk/gdk*) erneut prüfen, ob ein Fix vorliegt, bevor diese
    # Ausnahme unverändert stehen bleibt.
    #
    # Entschieden gegen: `glib` 0.18.5 (Cargo.lock). Überholt: AKTIV
    # BEOBACHTEN bei jedem gtk-rs-Versions-Update (glib/gtk/atk/gdk*) — s.
    # Begründung oben.
    "RUSTSEC-2024-0429", # glib::VariantStrIter 0.18.5 — AKTIV BEOBACHTEN bei gtk-rs-Updates, s. Begründung oben

    # --- RUSTSEC-2026-0495: documented risk acceptance (2026-11-14) ---
    #
    # russh < 0.65.0: the agent server (`russh::keys::agent::server`) signs
    # with confirm-constrained keys without calling `Agent::confirm`.
    # Decided by the maintainer, see issue #1310.
    #
    # Acceptable: the application does not use the russh agent server; outside
    # `vendor/russh` nothing references `keys::agent::server`. It only acts as
    # an SSH client (and talks to the user's agent as a client).
    #
    # Note: on `develop` russh comes from `vendor/russh` (path crate, 0.63.2),
    # which cargo-audit does not check, so the advisory only shows up where
    # russh comes from crates.io; the affected code is still present.
    #
    # Activation: while russh is the `[patch.crates-io]` path crate the A4
    # stale-exemption check (Spec 0090) would flag an active entry. Once russh
    # comes from crates.io again (no path patch) and is still < 0.65.0,
    # add the ID to `ignore` (quoted, as above; keep it unquoted while commented).
    #
    # Obsolete when: russh >= 0.65.0 is used, including an upgrade of
    # `vendor/russh`.
    # RUSTSEC-2026-0495 goes here once activated.
]

# Yanked crates have no RUSTSEC id (the yanked check runs against the crates.io
# index), so they cannot be listed in `ignore` above; the fix is to update the
# lockfile. `[yanked] enabled` stays at the default `true` so that future
# yanked findings stay visible.
