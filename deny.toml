highlight = "all"
workspace-default-features = "allow"
external-default-features = "allow"

# This section is considered when running `cargo deny check sources`.
[sources]
# Nur crates.io als erlaubte Quelle (Spec 0090, A13) — keine
# Git-Abhängigkeiten oder unbekannten Registries ohne bewusste, kommentierte
# Ausnahme hier (`allow-git`/`sources.allow-org` bleiben leer).
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
# Note (issue #1228): the temporary `[patch.crates-io] russh` points to the
# in-repo copy `vendor/russh` (a path source). Path sources need no entry here;
# no git or registry exception is required. Remove with the patch.

[sources.allow-org]
github = []
gitlab = []
bitbucket = []
