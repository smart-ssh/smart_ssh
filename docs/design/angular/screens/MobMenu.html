<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=390">
<title>Mobile – Navigation menu</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600&amp;family=Barlow+Condensed:wght@500;600;700&amp;family=JetBrains+Mono:wght@400;500;700&amp;display=swap">
<style>
body{margin:0;background:#0e1116}
*,*::before,*::after{box-sizing:border-box;border-radius:0 !important}
.ss{--surface-sunken:#080a0d;--surface:#0e1116;--surface-raised:#151a21;--border:#242b35;--border-strong:#3a4452;--fg-faint:#7d8796;--fg-muted:#aeb6c2;--fg-soft:#c9cfd8;--fg:#e3e7ed;--fg-strong:#f2f4f7;--accent:#2cc6e8;--accent-fg:#6fdcf2;--accent-subtle:#0a2630;--accent-border:#134a59;--warning:#f5a524;--warning-fg:#ffc266;--warning-border:#5a3e0e;--success:#3dd68c;--local:#d86cf0;font-family:Barlow,system-ui,sans-serif;font-size:15px;line-height:1.45;color:var(--fg);background:var(--surface)}
.lbl{font-family:"Barlow Condensed",sans-serif;font-weight:600;font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--fg-faint)}
.ico{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:square;stroke-linejoin:miter;flex:none}
.sq{width:8px;height:8px;display:inline-block;flex:none}
.en{display:flex;align-items:center;gap:12px;width:100%;min-height:48px;padding:0 14px;border:1px solid transparent;background:transparent;color:var(--fg-muted);font-family:"Barlow Condensed",sans-serif;font-weight:600;font-size:16px;letter-spacing:.06em;text-transform:uppercase;text-align:left;cursor:pointer}
.en.on{border-color:var(--accent-border);background:var(--accent-subtle);color:var(--accent-fg)}
.mono{font-family:"JetBrains Mono",monospace}
</style>
</head>
<body>
<div class="ss" style="width: 390px; height: 844px; position: relative; overflow: hidden">
  <div aria-hidden="true" style="position: absolute; inset: 0; background: #000000; opacity: .7"></div>
  <nav aria-label="Navigation menu" style="position: absolute; top: 0; left: 0; bottom: 0; width: 330px; background: var(--surface-raised); border-right: 1px solid var(--border-strong); display: flex; flex-direction: column">
    <div style="height: 56px; display: flex; align-items: center; gap: 10px; padding: 0 8px 0 16px; border-bottom: 1px solid var(--border)">
      <svg viewBox="0 0 64 64" style="width: 22px; height: 22px" aria-hidden="true"><path d="M48 14H16v18h32v18H16" style="fill: none; stroke: #e3e7ed; stroke-width: 8; stroke-linecap: square; stroke-linejoin: miter"></path><rect x="42" y="8" width="12" height="12" style="fill: #2cc6e8"></rect><rect x="10" y="44" width="12" height="12" style="fill: #2cc6e8"></rect></svg>
      <span style="flex: 1; font-family: 'Barlow Condensed', sans-serif; font-weight: 700; font-size: 17px; letter-spacing: .12em; text-transform: uppercase; color: var(--fg-strong)">Smart<span style="color: var(--accent)">SSH</span></span>
      <button type="button" aria-label="Close" style="width: 44px; height: 44px; background: transparent; border: 0; color: var(--fg-soft); display: flex; align-items: center; justify-content: center"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12 M18 6L6 18"></path></svg></button>
    </div>
    <div style="padding: 12px 10px; display: flex; flex-direction: column; gap: 2px; border-bottom: 1px solid var(--border)">
      <button class="en" type="button"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M9 2v5 M15 2v5 M6 7h12v5l-3 4H9l-3-4z M12 16v6"></path></svg>Connect</button>
      <button class="en" type="button"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 4h18v7H3z M3 13h18v7H3z M7 7.5h2 M7 16.5h2"></path></svg>Manage</button>
      <button class="en" type="button"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2l8 3v8l-8 9-8-9V5z M8.5 12l2.5 2.5 4.5-4.5"></path></svg>Filter Rules</button>
    </div>
    <div style="padding: 14px 10px 6px"><span class="lbl" style="padding-left: 4px">Open sessions</span></div>
    <div style="padding: 0 10px; display: flex; flex-direction: column; gap: 2px">
      <div style="display: flex"><button class="en on" type="button" style="text-transform: none; letter-spacing: 0"><span class="sq" style="background: var(--success)"></span><span class="mono" style="font-size: 14px; font-weight: 500">web-01</span></button><button type="button" aria-label="Close tab web-01" style="width: 48px; flex: none; background: transparent; border: 0; color: var(--fg-faint)"><svg class="ico" viewBox="0 0 24 24" style="width: 14px; height: 14px" aria-hidden="true"><path d="M6 6l12 12 M18 6L6 18"></path></svg></button></div>
      <div style="display: flex"><button class="en" type="button" style="text-transform: none; letter-spacing: 0"><span class="sq" style="background: var(--warning)"></span><span class="mono" style="font-size: 14px; font-weight: 500; color: var(--fg)">db-prod</span><span style="margin-left: auto; border: 1px solid var(--warning-border); color: var(--warning-fg); font-size: 11px; letter-spacing: .1em; text-transform: uppercase; padding: 1px 6px">Needs confirmation</span></button><button type="button" aria-label="Close tab db-prod" style="width: 48px; flex: none; background: transparent; border: 0; color: var(--fg-faint)"><svg class="ico" viewBox="0 0 24 24" style="width: 14px; height: 14px" aria-hidden="true"><path d="M6 6l12 12 M18 6L6 18"></path></svg></button></div>
      <div style="display: flex"><button class="en" type="button" style="text-transform: none; letter-spacing: 0"><span class="sq" style="background: var(--local)"></span><span class="mono" style="font-size: 14px; font-weight: 500; color: var(--fg)">Localhost</span></button><button type="button" aria-label="Close tab Localhost" style="width: 48px; flex: none; background: transparent; border: 0; color: var(--fg-faint)"><svg class="ico" viewBox="0 0 24 24" style="width: 14px; height: 14px" aria-hidden="true"><path d="M6 6l12 12 M18 6L6 18"></path></svg></button></div>
      <button class="en" type="button" style="color: var(--fg-faint)"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14 M5 12h14"></path></svg>New session</button>
    </div>
    <div style="flex: 1"></div>
    <div style="padding: 10px; border-top: 1px solid var(--border); display: flex; flex-direction: column; gap: 2px">
      <button class="en" type="button"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M2 12h5l3-8 4 16 3-8h5"></path></svg>Activities<span class="mono" style="margin-left: auto; font-size: 12px; color: var(--accent-fg)">1 running</span></button>
      <button class="en" type="button"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 6h9 M17 6h3 M15 3v6 M4 12h3 M11 12h9 M9 9v6 M4 18h11 M19 18h1 M17 15v6"></path></svg>Settings</button>
    </div>
  </nav>
</div>
</body>
</html>
