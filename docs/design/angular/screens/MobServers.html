<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=390">
<title>Mobile – Server list</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600&amp;family=Barlow+Condensed:wght@500;600;700&amp;family=JetBrains+Mono:wght@400;500;700&amp;display=swap">
<style>
body{margin:0;background:#0e1116}
*,*::before,*::after{box-sizing:border-box;border-radius:0 !important}
.ss{--surface-sunken:#080a0d;--surface:#0e1116;--surface-raised:#151a21;--border:#242b35;--border-strong:#3a4452;--fg-faint:#7d8796;--fg-subtle:#96a0ae;--fg-muted:#aeb6c2;--fg-soft:#c9cfd8;--fg:#e3e7ed;--fg-strong:#f2f4f7;--accent:#2cc6e8;--accent-fg:#6fdcf2;--accent-subtle:#0a2630;--accent-border:#134a59;--on-accent:#041015;--warning:#f5a524;--success:#3dd68c;--local:#d86cf0;--local-fg:#e9a6f7;--local-border:#5a2366;font-family:Barlow,system-ui,sans-serif;font-size:15px;line-height:1.45;color:var(--fg);background:var(--surface)}
.h{font-family:"Barlow Condensed",sans-serif;font-weight:600;text-transform:uppercase;letter-spacing:.06em}
.lbl{font-family:"Barlow Condensed",sans-serif;font-weight:600;font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--fg-faint)}
.mono{font-family:"JetBrains Mono",monospace}
.btn{font-family:"Barlow Condensed",sans-serif;font-weight:600;font-size:14px;letter-spacing:.08em;text-transform:uppercase;height:44px;padding:0 14px;border:1px solid var(--border-strong);background:transparent;color:var(--fg-soft);display:inline-flex;align-items:center;justify-content:center;gap:8px;cursor:pointer}
.ico{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:square;stroke-linejoin:miter;flex:none}
.sq{width:8px;height:8px;display:inline-block;flex:none}
.row{min-height:52px;display:flex;align-items:center;gap:12px;padding:0 16px;border-bottom:1px solid var(--border);position:relative}
.kid{padding-left:44px}
.kid::before{content:"";position:absolute;left:24px;top:0;bottom:0;width:1px;background:var(--border-strong)}
.kid::after{content:"";position:absolute;left:24px;top:26px;width:12px;height:1px;background:var(--border-strong)}
.sub{font-family:"JetBrains Mono",monospace;font-size:11.5px;color:var(--fg-faint)}
</style>
</head>
<body>
<div class="ss" style="width: 390px; height: 844px; display: flex; flex-direction: column; overflow: hidden">
  <header style="height: 56px; display: flex; align-items: center; gap: 8px; padding: 0 6px; background: var(--surface-sunken); border-bottom: 1px solid var(--border); flex: none">
    <button class="btn" type="button" aria-label="Open navigation menu" style="width: 44px; padding: 0; border-color: transparent"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 6h16 M4 12h16 M4 18h16"></path></svg></button>
    <svg viewBox="0 0 64 64" style="width: 18px; height: 18px" aria-hidden="true"><path d="M48 14H16v18h32v18H16" style="fill: none; stroke: #e3e7ed; stroke-width: 8; stroke-linecap: square; stroke-linejoin: miter"></path><rect x="42" y="8" width="12" height="12" style="fill: #2cc6e8"></rect><rect x="10" y="44" width="12" height="12" style="fill: #2cc6e8"></rect></svg>
    <span class="h" style="font-size: 16px; font-weight: 700; letter-spacing: .1em; color: var(--fg-strong)">Smart SSH</span>
  </header>

  <div style="display: flex; align-items: center; gap: 8px; padding: 14px 16px 10px">
    <span class="lbl" style="flex: 1">Servers</span>
    <button class="btn" type="button" style="height: 36px; font-size: 13px">+ Group</button>
    <button class="btn" type="button" style="height: 36px; font-size: 13px; background: var(--accent); border-color: var(--accent); color: var(--on-accent)">+ Server</button>
  </div>

  <div style="flex: 1; overflow: hidden; border-top: 1px solid var(--border)">
    <div class="row" style="color: var(--local-fg)"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M2 4h20v13H2z M8 21h8 M12 17v4 M6 8l3 2.5L6 13 M11 13h4"></path></svg><div style="flex: 1">Localhost<div class="sub">this device</div></div><span style="border: 1px solid var(--local-border); padding: 1px 6px; font-family: 'Barlow Condensed', sans-serif; font-weight: 600; font-size: 11px; letter-spacing: .1em; text-transform: uppercase">Local</span></div>
    <div class="row" style="background: var(--surface-sunken)"><svg class="ico" viewBox="0 0 24 24" style="width: 14px; height: 14px; color: var(--fg-faint)" aria-hidden="true"><path d="M6 9l6 6 6-6"></path></svg><svg class="ico" viewBox="0 0 24 24" style="color: var(--fg-muted)" aria-hidden="true"><path d="M3 20V5h6l2 2h8v3 M3 20l3-10h16l-3 10z"></path></svg><b style="flex: 1">production</b><span class="sub">3</span></div>
    <div class="row kid"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 4h18v7H3z M3 13h18v7H3z M7 7.5h2 M7 16.5h2 M13 7.5h4 M13 16.5h4"></path></svg><div style="flex: 1"><span class="mono" style="font-size: 14px">web-01</span><div class="sub">deploy@10.0.4.21</div></div><span class="sq" style="background: var(--success)"></span></div>
    <div class="row kid"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 4h18v7H3z M3 13h18v7H3z M7 7.5h2 M7 16.5h2 M13 7.5h4 M13 16.5h4"></path></svg><div style="flex: 1"><span class="mono" style="font-size: 14px">web-02</span><div class="sub">deploy@10.0.4.22</div></div></div>
    <div class="row kid"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 4h18v7H3z M3 13h18v7H3z M7 7.5h2 M7 16.5h2 M13 7.5h4 M13 16.5h4"></path></svg><div style="flex: 1"><span class="mono" style="font-size: 14px">db-prod</span><div class="sub">admin@10.0.6.12</div></div><span class="sq" style="background: var(--warning)"></span></div>
    <div class="row" style="background: var(--surface-sunken)"><svg class="ico" viewBox="0 0 24 24" style="width: 14px; height: 14px; color: var(--fg-faint)" aria-hidden="true"><path d="M9 6l6 6-6 6"></path></svg><svg class="ico" viewBox="0 0 24 24" style="color: var(--fg-muted)" aria-hidden="true"><path d="M3 5h6l2 2h10v13H3z M3 10h18"></path></svg><b style="flex: 1">staging</b><span class="sub">2</span></div>
    <div class="row" style="background: var(--surface-sunken)"><svg class="ico" viewBox="0 0 24 24" style="width: 14px; height: 14px; color: var(--fg-faint)" aria-hidden="true"><path d="M9 6l6 6-6 6"></path></svg><svg class="ico" viewBox="0 0 24 24" style="color: var(--fg-muted)" aria-hidden="true"><path d="M3 5h6l2 2h10v13H3z M3 10h18"></path></svg><b style="flex: 1">customers</b><span class="sub">7</span></div>
    <div class="row"><span style="width: 14px"></span><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 4h18v7H3z M3 13h18v7H3z M7 7.5h2 M7 16.5h2 M13 7.5h4 M13 16.5h4"></path></svg><div style="flex: 1"><span class="mono" style="font-size: 14px">backup-nas</span><div class="sub">root@192.168.1.20</div></div></div>
    <div class="row"><span style="width: 14px"></span><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 4h18v7H3z M3 13h18v7H3z M7 7.5h2 M7 16.5h2 M13 7.5h4 M13 16.5h4"></path></svg><div style="flex: 1"><span class="mono" style="font-size: 14px">pi-garage</span><div class="sub">pi@pi-garage.local</div></div></div>
  </div>
  <div style="display: flex; border-top: 1px solid var(--border); flex: none">
    <button class="btn" type="button" style="flex: 1; border: 0; border-right: 1px solid var(--border); height: 52px"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3v11 M7 9l5 5 5-5 M3 15v6h18v-6"></path></svg>Import …</button>
    <button class="btn" type="button" style="flex: 1; border: 0; height: 52px"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 14V3 M7 8l5-5 5 5 M3 15v6h18v-6"></path></svg>Export …</button>
  </div>
</div>
</body>
</html>
