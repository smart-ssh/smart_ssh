name: Mutants

# Manually triggered mutation test run over the security-critical modules
# (filter engine, risk classifier). Too heavy for developer machines and
# for every PR, so it only runs on demand. Surviving mutants do not fail
# the job; they are published in the `mutants-out` artifact (`missed.txt`,
# `caught.txt`, ...) so weak or tautological tests become visible.
on:
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  mutants:
    name: cargo-mutants (filter, risk)
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable

      - name: Cache cargo registry & build artifacts
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2

      - name: Install cargo-mutants
        run: cargo install cargo-mutants --version 27.1.0 --locked

      # Surviving mutants are the expected result, not a failure.
      - name: Run cargo-mutants
        run: |
          cargo mutants -p ssh-manager-core \
            --file 'crates/core/src/filter/**' \
            --file 'crates/core/src/risk/**' \
            --exclude '**/*tests*.rs' \
            --no-shuffle -j 2 --timeout 300 || true

      - name: Upload mutants.out
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: mutants-out
          path: mutants.out/
          retention-days: 14
          if-no-files-found: warn
