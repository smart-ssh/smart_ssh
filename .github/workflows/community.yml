name: Community

# Spec 0038, Abschnitt 6: beweist, dass das öffentliche Repo (dieser
# Workflow läuft aus einem frischen Klon, ohne Secrets) eigenständig baut —
# schlägt ein Schritt hier künftig fehl, weil etwas aus einem privaten Repo
# fehlt, ist das ein Bug in der Repository-Trennung, nicht im öffentlichen
# Code selbst. Umbenennung/Erweiterung des bisherigen `ci.yml` (Spec 0001)
# statt eines komplett neuen, parallelen Workflows: identische Matrix,
# identische Rust-Schritte — ein zweiter, redundanter Workflow hätte beide
# bei jeder künftigen Änderung synchron halten müssen, ohne echten Vorteil.
# Einzige inhaltliche Ergänzung ist der Frontend-Build (Abschnitt 6, unten).

on:
  push:
    branches: ["**"]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo registry & build artifacts
        uses: Swatinem/rust-cache@v2

      # Nur auf Linux nötig: Tauri (genauer `wry`) linkt gegen WebKitGTK,
      # ohne diese System-Pakete schlägt bereits `cargo build`/`clippy` für
      # `apps/smart-ssh-community` fehl — dieselben Pakete wie in
      # `release.yml`s Linux-Leg.
      - name: Install Linux dependencies
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf \
            libssl-dev

      - name: cargo fmt --check
        run: cargo fmt --all --check

      - name: cargo clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: cargo test
        run: cargo test --workspace

      - name: cargo build
        run: cargo build --workspace

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: apps/smart-ssh-community/frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: apps/smart-ssh-community/frontend
        run: npm ci

      - name: Frontend build
        working-directory: apps/smart-ssh-community/frontend
        run: npm run build

  # Spec 0035: Dependency-Audit (cargo-audit, RustSec-Advisories) und
  # Lizenz-/Herkunfts-Compliance (cargo-deny, D1 des Architektur-Briefs).
  # Eigenständiger, nicht-Matrix-Job auf `ubuntu-latest` (Spec 0035,
  # Abschnitt 4: nicht plattformspezifisch, ein einzelner Lauf reicht).
  #
  # Spec 0038, Abschnitt 5: macht aus `cargo deny check licenses` hier einen
  # PFLICHTSCHRITT (ohne `continue-on-error`), sofern Spec 0035 inzwischen
  # bereinigt und auf blockierend umgestellt wurde. Das ist zum Zeitpunkt
  # dieses Commits noch NICHT der Fall — `deny.toml`s eigener Kommentar und
  # der bisherige `ci.yml`-Job-Kommentar (unverändert unten übernommen)
  # sagen ausdrücklich, dass der Umstieg auf blockierend ein bewusster,
  # separater Folge-Schritt ist. Dieser Job bleibt deshalb unverändert im
  # Berichtsmodus (`continue-on-error: true`) — sobald Spec 0035 auf
  # blockierend umgestellt wird, muss dieser Kommentar (und die
  # `continue-on-error`-Zeile bei `cargo deny check licenses`) hier
  # nachgezogen werden.
  dependency-audit:
    name: Dependency Audit (cargo-deny / cargo-audit)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry & build artifacts
        uses: Swatinem/rust-cache@v2

      - name: Install cargo-deny and cargo-audit
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-deny,cargo-audit

      # Spec 0035, Abschnitt 2, letzter Punkt: Advisories bleiben
      # cargo-audits Aufgabe — dieser Aufruf prüft bewusst nur Lizenzen
      # und Herkunft (keine doppelte Konfiguration derselben Prüfung an
      # zwei Stellen). Konfiguration: `deny.toml` im Repo-Root.
      #
      # Spec 0035, Abschnitt 5 ("zweistufiges Vorgehen"): der aktuelle
      # Bestand wurde per lokalem Lauf einmalig durchgesehen und die dabei
      # gefundenen, bewusst freigegebenen Fälle sind bereits in
      # `deny.toml` eingetragen (s. dortige Kommentare) — trotzdem läuft
      # dieser Schritt hier noch im BERICHTSMODUS: `continue-on-error:
      # true`, damit ein künftiger, bislang unbedachter Fund die Pipeline
      # NICHT sofort rot färbt, sondern zunächst nur sichtbar wird. Der
      # Umstieg auf blockierend (Entfernen von `continue-on-error`) ist
      # ein bewusster, separater Folge-Schritt, sobald sich das in der
      # Praxis bewährt hat — NICHT Teil dieses Schritts.
      - name: cargo deny check (licenses, sources, bans)
        run: cargo deny check licenses sources bans
        continue-on-error: true

      # Konfiguration: `.cargo/audit.toml` (der von cargo-audit selbst
      # automatisch erkannte Pfad, s. dortiger Kommentar zum Schema/zur
      # Pfad-Konvention). Ebenfalls Berichtsmodus, gleiche Begründung wie
      # beim `cargo deny`-Schritt oben.
      - name: cargo audit
        run: cargo audit
        continue-on-error: true
