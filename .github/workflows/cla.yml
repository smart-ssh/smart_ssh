# CLA check for pull requests (see CLA.md and CONTRIBUTING.md).
#
# pull_request_target runs with the base repository's permissions so the bot can
# comment and set a status on pull requests from forks. This workflow never
# checks out or runs code from the pull request.
#
# Permissions:
#   contents: write       store signatures/cla.json on the cla-signatures branch
#   pull-requests: write  comment on the pull request asking for a signature
#   actions: write        re-run the check after a signature comment
#   statuses: write       set the commit status of the CLA check
name: CLA

on:
  pull_request_target:
    types: [opened, synchronize, closed]
  issue_comment:
    types: [created]

permissions:
  contents: write
  pull-requests: write
  actions: write
  statuses: write

jobs:
  cla:
    name: CLA signature
    runs-on: ubuntu-latest
    if: >-
      github.event_name == 'pull_request_target' ||
      github.event.issue.pull_request
    steps:
      - name: CLA Assistant
        if: >-
          github.event_name == 'pull_request_target' ||
          github.event.comment.body == 'recheck' ||
          github.event.comment.body == 'I have read the CLA Document and I hereby sign the CLA'
        uses: contributor-assistant/github-action@ca4a40a7d1004f18d9960b404b97e5f30a505a08 # v2.6.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          path-to-signatures: signatures/cla.json
          path-to-document: https://github.com/smart-ssh/smart_ssh/blob/develop/CLA.md
          branch: cla-signatures
          allowlist: brokoskokoli,*[bot]
