name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # Das volle Gate (Test-Matrix und Dependency-Audit aus `community.yml`)
  # läuft auf genau dem getaggten Commit. Scheitert ein Job, startet
  # `build-release` nicht, und es entsteht kein Release.
  gate:
    name: Gate
    uses: ./.github/workflows/community.yml
    permissions:
      contents: read

  build-release:
    name: Build (${{ matrix.platform }})
    needs: gate
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: 'macos-latest'
            args: '--target universal-apple-darwin'
          - platform: 'ubuntu-22.04'
            args: ''
          - platform: 'windows-latest'
            args: ''

    runs-on: ${{ matrix.platform }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: apps/smart-ssh-community/frontend/package-lock.json

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: Cache cargo dependencies & build
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      - name: Install Linux dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf \
            libssl-dev

      - name: Install frontend dependencies
        working-directory: apps/smart-ssh-community/frontend
        run: npm ci

      # Spec 0099, A2.1: jeder Release-Build der Matrix erzeugt die
      # Drittlizenz-Liste selbst vor dem Bau der App (statt eines
      # vorgelagerten Jobs) — ein eigener Job hätte nur
      # plattformübergreifenden Artefakt-Transfer ohne Nutzen hinzugefügt.
      # Dieselbe feste cargo-about-Version wie in
      # der Community-CI und im Skript selbst (A1.6).
      - name: Install cargo-about
        uses: taiki-e/install-action@f7e5d7c961414b23f5b25b2da9294395d08513ad # v2.87.26
        with:
          tool: cargo-about@0.9.2

      # A2.2: kein `continue-on-error` — scheitert die Erzeugung (fehlende
      # Lizenz, fehlendes Werkzeug), scheitert dieser Schritt und damit der
      # gesamte Release-Build für diese Plattform; `tauri-action` unten
      # läuft dann gar nicht erst, es entsteht kein Artefakt ohne Lizenzen.
      - name: Generate third-party license notices
        working-directory: apps/smart-ssh-community/frontend
        run: npm run generate-notices

      # A2.2, zweite Linie: unabhängig davon, warum eine Ausgabe fehlerhaft
      # wäre, prüft dieser eigene Schritt die Kennzeile (A1.8) explizit statt
      # sich allein auf den Rückgabewert des Skripts zu verlassen. `shell:
      # bash`, weil der Windows-Runner sonst PowerShell nähme.
      - name: Verify third-party license notices marker
        shell: bash
        run: |
          file="apps/smart-ssh-community/frontend/public/third-party-notices.txt"
          if [ ! -s "$file" ]; then
            echo "::error::$file fehlt oder ist leer - kein Release ohne Lizenzen (Spec 0099, A2.2)"
            exit 1
          fi
          if ! head -c 64 "$file" | grep -q "^SMART-SSH-THIRD-PARTY-NOTICES-V1"; then
            echo "::error::$file beginnt nicht mit der Kennzeile (Spec 0099, A1.8/A2.2)"
            exit 1
          fi

      - name: Build Tauri App and publish Release
        uses: tauri-apps/tauri-action@84b9d35b5fc46c1e45415bdb6144030364f7ebc5 # v0.6.2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: apps/smart-ssh-community
          tagName: v__VERSION__
          releaseName: 'v__VERSION__'
          releaseBody: 'See assets below to download and install this version.'
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.args }}
