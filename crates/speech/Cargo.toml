[package]
name = "speech"
version.workspace = true
rust-version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[lib]
name = "speech"
path = "src/lib.rs"

[dependencies]
futures = { workspace = true }
ssh-manager-core = { workspace = true }
reqwest = { workspace = true, features = ["stream", "rustls"] }
serde = { workspace = true, features = ["derive"] }
sha2 = { workspace = true }
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "sync", "fs", "io-util", "time"] }
tracing = { workspace = true }
whisper-rs = "0.16.0"
cpal = "0.18.2"

[dev-dependencies]
tempfile = { workspace = true }
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "sync", "fs", "io-util", "net", "time"] }

[target.'cfg(target_os = "android")'.dependencies]
tls-config = { workspace = true }

[lints]
workspace = true
