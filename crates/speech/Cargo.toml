[package]
name = "speech"
version.workspace = true
rust-version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[lib]
name = "speech"
path = "src/lib.rs"

[dependencies]
futures = { workspace = true }
ssh-manager-core = { workspace = true }
reqwest = { workspace = true, features = ["stream", "rustls"] }
serde = { workspace = true, features = ["derive"] }
sha2 = { workspace = true }
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "sync", "fs", "io-util", "time"] }
tracing = { workspace = true }
serde_json = { workspace = true }
cpal = "0.18.2"

# Parakeet and Whisper run on ONNX Runtime, statically linked from the prebuilt binaries
# `ort-sys` fetches at build time (never at run time). On Android the prebuilt
# set is the `nnapi` one (aarch64 and x86_64, the ABIs the APK ships); the
# execution provider is not used at run time, the CPU provider is.
ort = { version = "=2.0.0-rc.15", default-features = false, features = ["std", "api-22", "download-binaries", "tls-rustls"] }

[dev-dependencies]
tempfile = { workspace = true }
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "sync", "fs", "io-util", "net", "time"] }

[target.'cfg(target_os = "android")'.dependencies]
ort = { version = "=2.0.0-rc.15", default-features = false, features = ["nnapi"] }
tls-config = { workspace = true }

[lints]
workspace = true
