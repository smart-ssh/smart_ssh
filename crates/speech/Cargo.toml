[package]
name = "speech"
version.workspace = true
rust-version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[lib]
name = "speech"
path = "src/lib.rs"

[dependencies]
futures = { workspace = true }
ssh-manager-core = { workspace = true }
reqwest = { workspace = true, features = ["stream", "rustls"] }
serde = { workspace = true, features = ["derive"] }
sha2 = { workspace = true }
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "sync", "fs", "io-util", "time"] }
tracing = { workspace = true }
whisper-rs = "0.16.0"
cpal = "0.18.2"

[dev-dependencies]
serde_json = { workspace = true }
tempfile = { workspace = true }
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "sync", "fs", "io-util", "net", "time"] }

# Parakeet runs on ONNX Runtime, statically linked from the prebuilt binaries
# `ort-sys` fetches at build time (never at run time). Not built for Android.
[target.'cfg(not(target_os = "android"))'.dependencies]
ort = { version = "=2.0.0-rc.15", default-features = false, features = ["std", "api-22", "download-binaries", "tls-rustls"] }

[target.'cfg(target_os = "android")'.dependencies]
tls-config = { workspace = true }

[lints]
workspace = true
