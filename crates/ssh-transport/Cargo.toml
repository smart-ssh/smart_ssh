[package]
name = "ssh-transport"
version.workspace = true
rust-version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[lib]
name = "ssh_transport"
path = "src/lib.rs"

[features]
# Spec 0076, §6.2/§6.4.2: macht `test_keys::*` außerhalb dieser Crate
# nutzbar. `app-shell`s Tests brauchen echte OpenSSH-Schlüssel, um die
# `KeyFileReader`-Umsetzung zu prüfen — erzeugt statt eingebettet, damit
# in diesem **öffentlichen** Repo kein privater Schlüssel im Klartext
# liegt. Abhängige Crates aktivieren es unter `[dev-dependencies]`,
# es landet also nie in einem Release-Build.
test-support = ["dep:rand"]

[dependencies]
async-trait = { workspace = true }
bytes = "1.12.1"
chrono = { workspace = true }
portable-pty = "0.9"
# Nur für `test-support` (s. oben) — ohne das Feature nicht mitkompiliert.
# Dieselbe Kiste, die die Integrationstests dieser Crate ohnehin schon
# unter `[dev-dependencies]` benutzen, keine neue Abhängigkeit.
rand = { workspace = true, optional = true }
russh = { workspace = true }
russh-sftp = { workspace = true }
secrecy = { workspace = true }
zeroize = { workspace = true }
ssh-manager-core = { workspace = true }
# `process`/`fs`: Spec 0032 (lokaler Pseudo-Server) — `LocalTransport`
# ruft die Plattform-Shell als Kindprozess auf, `LocalFileSession` (Spec
# 0020-Trait, lokal implementiert) greift direkt aufs Dateisystem zu,
# beide Teil der eigentlichen Bibliothek, nicht nur der Test-Fixtures.
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "net", "io-util", "time", "sync", "process", "fs"] }

# Issue #324: `killpg` beendet beim Abbruch (Spec 0027) die ganze
# Prozessgruppe eines lokalen Kommandos. Bereits direkte Abhängigkeit von
# `app-logic` (ADR 0065), keine neue Kiste im Lockfile.
[target.'cfg(unix)'.dependencies]
libc = { workspace = true }

[dev-dependencies]
rand = { workspace = true }
tempfile = { workspace = true }
# Spec 0069, Teil A3: `start_paused = true` für den Timeout-Gegenbeweis
# (`connect_with_timeout`-Tests) — eine virtuelle statt einer echten Uhr,
# damit der Test nicht wirklich 10 Sekunden wartet. Nur `dev-dependencies`
# (wie im selben Muster bereits in `crates/app-shell/Cargo.toml`), keine
# zusätzliche Abhängigkeit, nur ein zusätzliches Feature der bestehenden.
tokio = { workspace = true, features = ["test-util"] }

[lints]
workspace = true
