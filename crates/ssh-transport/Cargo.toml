[package]
name = "ssh-transport"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
name = "ssh_transport"
path = "src/lib.rs"

[dependencies]
async-trait = "0.1.92"
bytes = "1.12.1"
chrono = "0.4.45"
portable-pty = "0.9"
russh = "0.63.1"
russh-sftp = "2.4.0"
secrecy = "0.10.3"
ssh-manager-core = { version = "0.3.0", path = "../core" }
# `process`/`fs`: Spec 0032 (lokaler Pseudo-Server) — `LocalTransport`
# ruft die Plattform-Shell als Kindprozess auf, `LocalFileSession` (Spec
# 0020-Trait, lokal implementiert) greift direkt aufs Dateisystem zu,
# beide Teil der eigentlichen Bibliothek, nicht nur der Test-Fixtures.
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros", "net", "io-util", "time", "sync", "process", "fs"] }

[dev-dependencies]
rand = "0.10.2"
tempfile = "3.27.0"
