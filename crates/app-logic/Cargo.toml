[package]
name = "app-logic"
version.workspace = true
rust-version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[lib]
name = "app_logic"
path = "src/lib.rs"

[features]
# Spec 0084, A5: Testhilfen, die sowohl `app-logic`s eigene Tests als auch
# `app-shell`s Tests brauchen (u. a. `InMemoryProfileStore`/
# `InMemoryCredentialStore`, `session_with_transport`, `policy::
# NoRulesPolicyStore`), liegen hinter diesem Feature statt hinter reinem
# `#[cfg(test)]` — sonst wären sie außerhalb dieser Crate nicht sichtbar.
# `app-shell` aktiviert es nur unter `[dev-dependencies]` (Muster: die
# Dev-Abhängigkeit auf `ssh-manager-core` in `app-shell/Cargo.toml`, dort
# ebenfalls `test-support`). Kein Produktivbau aktiviert es.
test-support = []

[dependencies]
# Issue #104: NFKC-Normalisierung der Urteilswerte (Spec 0074).
unicode-normalization = { workspace = true }
ai-providers = { workspace = true }
async-trait = { workspace = true }
base64 = { workspace = true }
chrono = { workspace = true, features = ["serde"] }
credentials-keyring = { workspace = true }
directories = { workspace = true }
futures = { workspace = true }
# Spec 0075, §9 Q-1 Punkt 1 (übernommen aus app-shell/Cargo.toml, s. dort
# für die volle Begründung): löst `Include`-Pfad-Platzhalter auf
# (`ssh_config_import`).
globset = { workspace = true }
# ADR 0065 §3 (Nachtrag) (übernommen aus app-shell/Cargo.toml): `O_NONBLOCK` für
# `key_files.rs`.
libc = { workspace = true }
mcp-server = { workspace = true }
persistence-sqlite = { workspace = true }
regex = { workspace = true }
secrecy = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
sha2 = { workspace = true }
ssh-manager-core = { workspace = true }
ssh-transport = { workspace = true }
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "sync", "time"] }
tokio-util = { workspace = true, features = ["rt"] }
tracing = { workspace = true }
tracing-appender = "0.2.5"
# `logging.rs` (Aufbau des globalen `tracing`-Subscribers) — normale
# Abhängigkeit, nicht nur `[dev-dependencies]`, weil das Produktivlogging
# selbst hier liegt (nicht nur Test-Infrastruktur).
tracing-subscriber = { workspace = true, features = ["json", "env-filter"] }
uuid = { workspace = true, features = ["v4", "serde"] }
zeroize = { workspace = true }

[dev-dependencies]
# Issue #104: Eigenschaftstest gegen den Fallback-Parser. Nur hier.
proptest = { workspace = true }
# Spec 0101 (spec-reviewer Runde 1): Die Tests dieser Crate legen
# Klartext-Datenbanken an (Ausgangszustand einer bestehenden
# Installation) und brauchen dafuer `connect_plaintext`. Nur hier, nie
# unter `[dependencies]`.
persistence-sqlite = { workspace = true, features = ["test-support"] }
tempfile = { workspace = true }
# Spec 0020, Abschnitt 6 (Muster wie app-shell/Cargo.toml).
ssh-manager-core = { workspace = true, features = ["test-support"] }
# Spec 0076, §6.2 (Muster wie app-shell/Cargo.toml).
ssh-transport = { workspace = true, features = ["test-support"] }
tokio = { workspace = true, features = ["test-util"] }

[lints]
workspace = true
