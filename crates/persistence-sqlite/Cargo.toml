[package]
name = "persistence-sqlite"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[lib]
name = "persistence_sqlite"
path = "src/lib.rs"

[features]
# Spec 0101 (spec-reviewer Runde 1): macht `SqliteProfileStore::
# connect_plaintext` ausserhalb dieser Crate sichtbar -- den Weg, der eine
# **unverschluesselte** Datenbank oeffnet. Nur Tests duerfen ihn gehen;
# `app-logic`/`app-shell` aktivieren das Feature deshalb ausschliesslich
# unter `[dev-dependencies]` (dasselbe Muster wie `app-logic/test-support`).
# Kein Produktivbau aktiviert es, und damit faengt der
# `cargo build --workspace`-Schritt des Gates einen Produktivaufruf ab.
test-support = []

[dependencies]
async-trait = "0.1.92"
chrono = { version = "0.4.45", features = ["serde"] }
directories = "6.0.0"
# Spec 0101, A1: SQLite wird mit SQLCipher gebaut, statt per `sqlx`s eigenem
# `sqlite-bundled`-Feature (plain SQLite) zu laufen. `sqlx-sqlite` zieht
# `libsqlite3-sys` ohnehin schon (mit Feature `bundled`); diese explizite
# Abhängigkeit auf dieselbe Version unifiziert ihr Feature-Set per Cargo
# (gemessen, s. Spec 0101 Abschnitt 1 „Messungen“: `bundled-sqlcipher-vendored-openssl` →
# `bundled-sqlcipher` → `bundled`, deckungsgleich mit `sqlx-sqlite/bundled`)
# statt eine zweite, konkurrierende SQLite-Kopie zu bauen.
libsqlite3-sys = { version = "=0.37.0", features = ["bundled-sqlcipher-vendored-openssl"] }
# Spec 0101, A2: der `PRAGMA key`-Wert kommt als `SecretString` aus
# `core::crypto::DatabaseKey` und wird erst beim Aufbau der Verbindung
# ausgepackt. Schon im Abhängigkeitsbaum (direkte Abhängigkeit von `core`).
secrecy = "0.10.3"
serde_json = "1.0.151"
sqlx = { version = "0.9.0", features = ["sqlite", "runtime-tokio", "tls-rustls", "migrate", "chrono", "uuid", "sqlite-bundled"] }
ssh-manager-core = { version = "0.5.2", path = "../core" }
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros", "fs", "sync"] }
tracing = "0.1.44"
uuid = { version = "1.26.0", features = ["v4", "serde"] }

[dev-dependencies]
tempfile = "3.27.0"
# Spec 0101, A2 (spec-reviewer Runde 1): Der Nachweis, dass der
# Datenbankschluessel in keinem `tracing`-Ereignis auftaucht, schneidet den
# Ereignisstrom mit. Dieselbe Fassung und dasselbe Muster wie in
# `core`/`ai-providers`/`app-shell`.
tracing-subscriber = { version = "0.3.23", features = ["json"] }

# Spec 0101 (spec-reviewer Runde 1): Das Beispiel oeffnet die Datenbank
# **unverschluesselt** und braucht dafuer `connect_plaintext`, das hinter
# `test-support` liegt. Mit `required-features` scheitert es nicht an einem
# unerklaerlichen Compilerfehler, sondern wird ohne das Feature gar nicht
# gebaut -- und ein `cargo clippy --all-targets` des Gates bleibt gruen.
[[example]]
name = "add_test_server"
required-features = ["test-support"]
