[package]
name = "persistence-sqlite"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
name = "persistence_sqlite"
path = "src/lib.rs"

[dependencies]
async-trait = "0.1.92"
chrono = { version = "0.4.45", features = ["serde"] }
directories = "6.0.0"
serde_json = "1.0.151"
sqlx = { version = "0.9.0", features = ["sqlite", "runtime-tokio", "tls-rustls", "migrate", "chrono", "uuid", "sqlite-bundled"] }
ssh-manager-core = { version = "0.3.0", path = "../core" }
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros", "fs"] }
tracing = "0.1.44"
uuid = { version = "1.26.0", features = ["v4", "serde"] }

[dev-dependencies]
tempfile = "3.27.0"
