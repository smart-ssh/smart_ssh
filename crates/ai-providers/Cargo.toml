[package]
name = "ai-providers"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
name = "ai_providers"
path = "src/lib.rs"

[dependencies]
async-trait = "0.1.92"
futures = "0.3.34"
reqwest = { version = "0.13.4", default-features = false, features = ["stream", "json", "rustls"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
ssh-manager-core = { version = "0.1.0", path = "../core" }
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros"] }
uuid = "1.26.0"

[dev-dependencies]
tokio = { version = "1.53.1", features = ["macros", "rt-multi-thread"] }
wiremock = "0.6.5"
