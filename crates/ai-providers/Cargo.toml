[package]
name = "ai-providers"
version.workspace = true
rust-version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[lib]
name = "ai_providers"
path = "src/lib.rs"

[dependencies]
chrono = { workspace = true }
futures = { workspace = true }
reqwest = { workspace = true, features = ["stream", "json", "rustls"] }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
ssh-manager-core = { workspace = true }
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "time"] }
tracing = { workspace = true }
uuid = { workspace = true, features = ["v4"] }

[dev-dependencies]
# `RedactedContext::for_tests` (issue #833); never in `[dependencies]`.
ssh-manager-core = { workspace = true, features = ["test-support"] }
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "time", "test-util"] }
tracing-subscriber = { workspace = true, features = ["json"] }
wiremock = "0.6.5"

# Android (Spec 0114, ADR 0148): the platform certificate verifier needs JNI
# initialisation, so TLS there uses the bundled webpki roots instead.
[target.'cfg(target_os = "android")'.dependencies]
tls-config = { workspace = true }
