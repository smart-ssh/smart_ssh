[package]
name = "ssh-manager-core"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[lib]
name = "ssh_manager_core"
path = "src/lib.rs"

[features]
# Spec 0020, Abschnitt 6: macht `ssh::mock::MockSftpSession` auch außerhalb
# dieser Crate nutzbar (ein reines `#[cfg(test)]`-Modul wäre nur innerhalb
# von `core`s eigenen Tests sichtbar) — abhängige Crates aktivieren es unter
# `[dev-dependencies]`, sodass es nie in einen Release-Build gerät.
test-support = []

[dependencies]
async-trait = "0.1.92"
base64 = "0.23.1"
chacha20poly1305 = "0.10.1"
chrono = { version = "0.4.45", features = ["serde"] }
futures = "0.3.34"
globset = "0.4.20"
regex = "1.13.1"
secrecy = "0.10.3"
serde = { version = "1.0.229", features = ["derive"] }
shell-words = "1.1.1"
thiserror = "2.0"
tokio = { version = "1.53.1", features = ["sync"] }
tracing = "0.1.44"
uuid = { version = "1.26.0", features = ["v4", "serde"] }

[dev-dependencies]
tokio = { version = "1.53.1", features = ["macros", "rt-multi-thread"] }
