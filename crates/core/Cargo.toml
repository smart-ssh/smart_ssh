[package]
name = "ssh-manager-core"
version.workspace = true
rust-version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[lib]
name = "ssh_manager_core"
path = "src/lib.rs"

[features]
# Spec 0020, Abschnitt 6: macht `ssh::mock::MockSftpSession` auch außerhalb
# dieser Crate nutzbar (ein reines `#[cfg(test)]`-Modul wäre nur innerhalb
# von `core`s eigenen Tests sichtbar) — abhängige Crates aktivieren es unter
# `[dev-dependencies]`, sodass es nie in einen Release-Build gerät.
test-support = []

# Issue #919: generates src/generated/ipc.ts; not compiled without the feature.
ts-export = ["dep:ts-rs"]

[dependencies]
ts-rs = { workspace = true, optional = true }
# Spec 0101, A14: Argon2id leitet den Schlüssel ab, unter dem der
# Wurzelschlüssel K im Passwort-Modus verpackt liegt. Wie `hkdf` und `sha2`
# liegt die Crate bereits im Abhängigkeitsbaum dieses Workspace (s. Spec
# 0101 §1 „Vorhanden") — hier nur zu einer direkten Abhängigkeit von `core`
# hochgestuft, kein neuer Eintrag in `Cargo.lock` und keine neue Lizenz.
#
# `default-features = false` mit `alloc`: Die Standardausstattung zieht
# `password-hash`s PHC-String-Kodierung mit; davon braucht A14 nichts (das
# Format steht in `crypto::key_wrapping`), und was nicht eingebunden ist,
# kann auch nicht versehentlich benutzt werden.
argon2 = { version = "0.6.0", default-features = false, features = ["alloc"] }
async-trait = { workspace = true }
base64 = { workspace = true }
chacha20poly1305 = "0.10.1"
chrono = { workspace = true, features = ["serde"] }
futures = { workspace = true }
globset = { workspace = true }
# Spec 0101, A2: HKDF-SHA256 für die Ableitung des Datenbankschlüssels aus
# dem Wurzelschlüssel. Beide Crates liegen bereits im Abhängigkeitsbaum
# dieses Workspace (`sha2` als direkte Abhängigkeit von `app-logic`, `hkdf`
# über `elliptic-curve`/`russh`) — hier nur zu einer direkten Abhängigkeit
# von `core` hochgestuft, kein neuer Eintrag in `Cargo.lock` und keine neue
# Lizenz.
hkdf = "0.13.0"
regex = { workspace = true }
secrecy = { workspace = true }
serde = { workspace = true, features = ["derive"] }
sha2 = { workspace = true }
shell-words = "1.1.1"
thiserror = { workspace = true }
tokio = { workspace = true, features = ["sync"] }
tracing = { workspace = true }
uuid = { workspace = true, features = ["v4", "serde"] }
# Spec 0101, A19: Schlüsselmaterial wird beim Freigeben überschrieben
# (`DatabaseKey`). Ebenfalls schon im Baum (über `chacha20poly1305`).
zeroize = { workspace = true }

[dev-dependencies]
# Issue #247: Eigenschaftstest „der Redactor redigiert nie weniger als die
# eingefrorene Referenz“. Nur für Tests, gleiche Fassung wie in `app-logic`.
proptest = { workspace = true }
# Issue #469: Serde-Round-trip-Tests für Anhänge und `Feature` (nur Tests; schon im Lockfile).
serde_json = { workspace = true }
# Issue #366: Vollständigkeitstest „jedes Schlüsselwort wird auch in NFD-Form
# redigiert“ gegen die Referenz-Normalisierung. Nur für Tests; die Crate ist
# schon transitiv im Lockfile.
unicode-normalization = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
# Spec 0077, T-A10: Der Test zeichnet die ERROR-Ereignisse aus 3.2.2 auf und
# prüft, dass das Kommando nicht darin landet. Nur für Tests — dieselbe
# Fassung und dasselbe Muster wie in `ai-providers`/`app-shell`.
tracing-subscriber = { workspace = true, features = ["json"] }

[[example]]
name = "profiles_demo"
required-features = ["test-support"]

[lints]
workspace = true
