[package]
name = "mcp-server"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
async-trait = "0.1.92"
axum = { version = "0.8.9", default-features = false, features = ["http1", "tokio", "json"] }
rmcp = { version = "3.2.0", features = ["server", "macros", "transport-streamable-http-server", "schemars"] }
schemars = "1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
ssh-manager-core = { version = "0.3.0", path = "../core" }
tokio = { version = "1.53.1", features = ["sync", "time", "rt"] }
tokio-util = "0.7.19"
tracing = "0.1.44"
uuid = { version = "1.26.0", features = ["v4", "serde"] }

[dev-dependencies]
reqwest = { version = "0.13.2", default-features = false, features = ["rustls"] }
rmcp = { version = "3.2.0", features = ["client", "transport-streamable-http-client-reqwest"] }
tokio = { version = "1.53.1", features = ["macros", "rt-multi-thread"] }
tower = { version = "0.5.3", features = ["util"] }
