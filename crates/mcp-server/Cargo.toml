[package]
name = "mcp-server"
version.workspace = true
rust-version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
async-trait = { workspace = true }
axum = { version = "0.8.9", default-features = false, features = ["http1", "tokio", "json"] }
secrecy = { workspace = true }
rmcp = { version = "3.2.0", features = ["server", "macros", "transport-streamable-http-server", "schemars"] }
schemars = "1"
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
subtle = "2.6.1"
ssh-manager-core = { workspace = true }
tokio = { workspace = true, features = ["sync", "time", "rt"] }
tokio-util = { workspace = true }
tracing = { workspace = true }
uuid = { workspace = true, features = ["v4", "serde"] }

[dev-dependencies]
reqwest = { workspace = true, features = ["rustls"] }
rmcp = { version = "3.2.0", features = ["client", "transport-streamable-http-client-reqwest"] }
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
tower = { version = "0.5.3", features = ["util"] }
# Spec 0094, §7: Mitschnitt der `tracing`-Ereignisse in `test_support.rs`.
# Nur für Tests — dieselbe Fassung und dasselbe Muster wie in `core`/
# `ai-providers`.
tracing-subscriber = { workspace = true, features = ["json"] }
