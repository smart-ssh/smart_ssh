[package]
name = "app-shell"
version.workspace = true
rust-version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[lib]
name = "app_shell"
path = "src/lib.rs"

[dependencies]
ai-providers = { workspace = true }
# Spec 0084: die Tauri-freie Anwendungslogik — `app-shell` hängt von ihr ab,
# nie umgekehrt (A3, s. `docs/architecture.md`).
app-logic = { workspace = true }
async-trait = { workspace = true }
chrono = { workspace = true, features = ["serde"] }
credentials-keyring = { workspace = true }
directories = { workspace = true }
futures = { workspace = true }
mcp-server = { workspace = true }
persistence-sqlite = { workspace = true }
regex = { workspace = true }
secrecy = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
speech = { workspace = true }
ssh-manager-core = { workspace = true }
ssh-transport = { workspace = true }
tauri = { workspace = true }
tls-config = { workspace = true }
tauri-plugin-android-host = { workspace = true }
tauri-plugin-dialog = { workspace = true }
tauri-plugin-notification = { workspace = true }
tauri-plugin-opener = { workspace = true }
tauri-plugin-os = { workspace = true }
tauri-plugin-store = { workspace = true }
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "sync", "time"] }
tracing = { workspace = true }
uuid = { workspace = true, features = ["v4", "serde"] }

# Desktop-only dependencies (Spec 0114, ADR 0148): these crates have no
# Android backend or are empty there, so they are not compiled for it.
[target.'cfg(target_os = "android")'.dependencies]
# Issue #679: opens `content://` URIs from the system file picker as file
# descriptors (already in the tree through `tauri-plugin-dialog`).
tauri-plugin-fs = { workspace = true }

[target.'cfg(not(target_os = "android"))'.dependencies]
# Issue #358: file references on the system clipboard (macOS/Windows/X11/Wayland).
clipboard-rs = { version = "0.3.5", default-features = false }
tauri-plugin-decoration = { workspace = true }
# Issue #19: ein zweiter Start desselben Builds holt die laufende Instanz
# nach vorn (s. `src/single_instance.rs`). Keine neue transitive
# Abhaengigkeit: alles, was das Plugin braucht, ist schon im Baum.
tauri-plugin-single-instance = "2.5.2"
# Spec 0059 (fataler Startfehler-Dialog): war bereits transitiv über
# `tauri-plugin-dialog` im Baum (s. `Cargo.lock`) — hier direkt gepinnt,
# weil `rfd::MessageDialog` bewusst OHNE `tauri-plugin-dialog`s
# `AppHandle`-Maschinerie aufgerufen wird (die braucht eine bereits
# laufende Tauri-App, s. `crate::startup_dialog`-Moduldoc): der native
# Dialog muss VOR `tauri::Builder::default()` funktionieren.
# `default-features = false` + `gtk3` (statt `rfd`s eigenem Default
# `xdg-portal`/`wayland`/`async-std`, ein D-Bus-basierter Linux-Backend):
# `tauri-plugin-dialog` selbst aktiviert standardmäßig `rfd/gtk3` (s.
# dessen `Cargo.toml`, `default = ["gtk3"]`) — Cargos Feature-Unifikation
# würde ohne dieses Override zwar ohnehin beide Backends gleichzeitig
# kompilieren, hier aber bewusst explizit auf denselben, bereits im
# echten Build laufenden Backend festgelegt, statt ihn nur zufällig über
# die transitive Abhängigkeit mitzubekommen. `common-controls-v6`: nötig
# für einen modern gerenderten Windows-Dialog (`TaskDialogIndirect` statt
# der alten `MessageBox`-API).
rfd = { version = "0.16.0", default-features = false, features = [
    "gtk3",
    "common-controls-v6",
] }

[dev-dependencies]
tracing-subscriber = { workspace = true }
# Spec 0101 (spec-reviewer Runde 1): Die Tests dieser Crate legen
# Klartext-Datenbanken an (Ausgangszustand einer bestehenden
# Installation) und brauchen dafuer `connect_plaintext`. Nur hier, nie
# unter `[dependencies]`.
persistence-sqlite = { workspace = true, features = ["test-support"] }
tempfile = { workspace = true }
toml = { workspace = true }
# ADR 0065 §3 (Nachtrag): `libc::mkfifo` im Testaufbau von
# `ssh_config_apply/tests.rs` — nach Spec 0084 der einzige verbliebene
# Gebrauch in dieser Crate, deshalb nur noch `[dev-dependencies]`.
libc = { workspace = true }
base64 = { workspace = true }
# Spec 0084, A5: aktiviert `app_logic::test_support`/`app_logic::policy`
# (dort hinter `#[cfg(any(test, feature = "test-support"))]`) für diese
# Crates eigene Tests — nur unter `[dev-dependencies]`, landet also nie in
# einem Release-Build. Dasselbe Muster wie bei `ssh-manager-core` direkt
# darunter.
app-logic = { workspace = true, features = ["test-support"] }
# Spec 0020, Abschnitt 6: aktiviert `ssh_manager_core::ssh::mock` (dort
# hinter `#[cfg(any(test, feature = "test-support"))]`) für diese Crates
# eigene Tests — nur unter `[dev-dependencies]`, landet also nie in einem
# Release-Build.
ssh-manager-core = { workspace = true, features = ["test-support"] }
# Spec 0076, §6.2: `ssh_transport::test_keys` erzeugt echte
# OpenSSH-Schlüssel für die Tests der `KeyFileReader`-Umsetzung — erzeugt
# statt eingebettet, damit in diesem öffentlichen Repo kein privater
# Schlüssel im Klartext liegt. Nur `[dev-dependencies]`.
ssh-transport = { workspace = true, features = ["test-support"] }
tauri = { workspace = true, features = ["test"] }
# Issue #395: the two-hop reconnect test includes the in-process SSH test
# server of `ssh-transport` (`tests/fixtures/test_server.rs`) via `#[path]`
# and therefore needs its dependencies. Same crates and versions as
# `ssh-transport` already uses; dev-only, never part of a release build.
rand = { workspace = true }
russh = { workspace = true }
russh-sftp = { workspace = true }
# Spec 0046, Fund 4: `start_paused`/`tokio::time::advance` fürs Testen des
# Backend-Timeouts auf eine wartende `Confirm`-Aktion, ohne 3600 echte
# Sekunden abzuwarten. Nur unter `[dev-dependencies]`, landet nie in einem
# Release-Build.
tokio = { workspace = true, features = ["test-util"] }

[lints]
workspace = true
