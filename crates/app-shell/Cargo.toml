[package]
name = "app-shell"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[lib]
name = "app_shell"
path = "src/lib.rs"

[dependencies]
ai-providers = { version = "0.3.0", path = "../ai-providers" }
async-trait = "0.1.92"
base64 = "0.23.1"
chrono = { version = "0.4.45", features = ["serde"] }
credentials-keyring = { version = "0.3.0", path = "../credentials-keyring" }
directories = "6.0.0"
futures = "0.3.34"
mcp-server = { version = "0.3.0", path = "../mcp-server" }
persistence-sqlite = { version = "0.3.0", path = "../persistence-sqlite" }
regex = "1.13.1"
secrecy = "0.10.3"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha2 = "0.11.0"
ssh-manager-core = { version = "0.3.0", path = "../core" }
ssh-transport = { version = "0.3.0", path = "../ssh-transport" }
tauri = { version = "2", features = [] }
tauri-plugin-decoration = "3.0"
tauri-plugin-dialog = "2.7.2"
tauri-plugin-notification = "2"
tauri-plugin-opener = "2.5.5"
tauri-plugin-os = "2"
tauri-plugin-store = "2"
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros", "sync", "time"] }
tracing = "0.1.44"
tracing-appender = "0.2.5"
tracing-subscriber = { version = "0.3.23", features = ["json", "env-filter"] }
uuid = { version = "1.26.0", features = ["v4", "serde"] }

[dev-dependencies]
tempfile = "3.27.0"
# Spec 0020, Abschnitt 6: aktiviert `ssh_manager_core::ssh::mock` (dort
# hinter `#[cfg(any(test, feature = "test-support"))]`) für diese Crates
# eigene Tests — nur unter `[dev-dependencies]`, landet also nie in einem
# Release-Build.
ssh-manager-core = { path = "../core", features = ["test-support"] }
tauri = { version = "2", features = ["test"] }
