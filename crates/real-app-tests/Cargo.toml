[package]
name = "real-app-tests"
version.workspace = true
rust-version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
description = "Starts the real desktop app through tauri-driver (WebDriver) and checks its startup paths (issue #235, Spec 0090)."

# Test-only package: nothing in the shipped application depends on it. The
# tests in `tests/` are `#[ignore]`d because they need a built app,
# `tauri-driver`, a display and a Secret Service session; the CI job runs
# them with `--ignored` (ADR 0140).
# Everything is a dev-dependency on purpose: the production dependency graph
# (`cargo tree --edges normal,build`, which `network_boundary.rs` inspects for
# HTTP clients) must not see WebDriver's HTTP client. This package has no
# library or binary target.
[dev-dependencies]
app-logic = { workspace = true }
base64 = { workspace = true }
credentials-keyring = { workspace = true }
persistence-sqlite = { workspace = true, features = ["test-support"] }
secrecy = { workspace = true }
serde_json = { workspace = true }
ssh-manager-core = { workspace = true }
tempfile = { workspace = true }
# No `manager` feature: it downloads browser drivers at runtime. The driver
# is `tauri-driver`, installed by the CI job.
thirtyfour = { version = "0.37.7", default-features = false, features = ["reqwest", "rustls"] }
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "process", "net", "time"] }
uuid = { workspace = true, features = ["v4"] }
chrono = { workspace = true }
